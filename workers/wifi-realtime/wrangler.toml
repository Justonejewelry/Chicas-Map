name = "chicas-wifi-realtime"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Durable Object binding for per-city report rooms
[[durable_objects.bindings]]
name = "WIFI_ROOM"
class_name = "WifiRoom"

# Free plan requires SQLite-backed DO classes
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WifiRoom"]

[vars]
# Allowed browser origins (comma-separated). Add your Pages URL.
ALLOWED_ORIGINS = "https://justonejewelry.github.io,http://localhost:5500,http://127.0.0.1:5500"
