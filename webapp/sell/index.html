<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sell · Item Listing</title>
<link rel="icon" type="image/svg+xml" href="/Chicas-Map/favicon.svg">
<style>
:root { --bg:#0e0e0e; --paper:#1a1a1a; --ink:#f5f5f5; --muted:#a1a1aa; --magenta:#c513af; --ok:#22c55e; --warn:#f59e0b; --border:#2a2a2a; }
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:16px 16px 100px;line-height:1.45}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.95rem;margin-bottom:20px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 6px;font-size:.9rem}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#111;color:var(--ink);font-size:1rem}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:var(--magenta);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;min-height:44px;cursor:pointer}
button.secondary{background:#333}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;border:1px solid var(--border)}
.ready{font-size:.9rem;margin-top:8px;padding:8px 10px;border-radius:8px;background:#111}
.ready.ok{color:var(--ok);border:1px solid #14532d}
.ready.warn{color:var(--warn);border:1px solid #78350f}
.tier{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:.75rem;padding:4px 8px;border-radius:999px;background:#222;color:var(--muted)}
.pill.on{background:var(--magenta);color:#fff}
.speed{font-size:.85rem;color:var(--muted);margin-top:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<h1>Sell</h1>
<p class="sub">Phone-first listing for Facebook Marketplace, Nextdoor, and Craigslist. Photo + write-up leave together.</p>

<div class="card">
  <label>Photos (1–5)</label>
  <input type="file" id="photos" accept="image/*" multiple>
  <div class="photos" id="preview"></div>
</div>

<div class="card">
  <label for="title">Title</label>
  <input id="title" placeholder="Brass lamp, working, minor scuff">

  <label for="price">Asking price</label>
  <input id="price" type="number" inputmode="decimal" placeholder="45">

  <div class="tier" id="tiers">
    <span class="pill" data-tier="fast">Fast</span>
    <span class="pill" data-tier="market">2–3 days</span>
    <span class="pill" data-tier="top">Top dollar</span>
  </div>
  <div class="speed" id="speed">Set a price to see speed.</div>

  <label for="neighborhood">Pickup neighborhood</label>
  <input id="neighborhood" placeholder="North San Antonio / 78240">

  <label for="writeup">Write-up</label>
  <textarea id="writeup" placeholder="Works great. Minor scuff on rear panel, fully functional. Cash or Zelle, local pickup."></textarea>
</div>

<div class="card">
  <button id="shareBtn" type="button">Share listing</button>
  <button id="copyBtn" type="button" class="secondary">Copy write-up</button>
  <div class="ready warn" id="ready">Missing: photo, title, price, write-up, pickup neighborhood</div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let files = [];

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function updateReady(){
  const missing = [];
  if(!files.length) missing.push('photo');
  if(!$('title').value.trim()) missing.push('title');
  if(!$('price').value) missing.push('price');
  if(!$('writeup').value.trim()) missing.push('write-up');
  if(!$('neighborhood').value.trim()) missing.push('pickup neighborhood');
  const el = $('ready');
  if(!missing.length){
    el.className = 'ready ok';
    el.textContent = 'Photo, price, and write-up are in. Ready to share.';
  } else {
    el.className = 'ready warn';
    el.textContent = 'Missing: ' + missing.join(', ');
  }
}

function updateSpeed(){
  const p = parseFloat($('price').value);
  const speed = $('speed');
  if(!p){ speed.textContent = 'Set a price to see speed.'; return; }
  // simple client-side tiers for demo; replace with real comps later
  if(p < 30) speed.textContent = 'Priced for Fast Sale (same day)';
  else if(p < 60) speed.textContent = 'Competitive — 2–3 days';
  else speed.textContent = 'Top dollar — room to negotiate';
}

$('photos').addEventListener('change', e => {
  files = Array.from(e.target.files).slice(0,5);
  const prev = $('preview');
  prev.innerHTML = '';
  files.forEach(f => {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = URL.createObjectURL(f);
    prev.appendChild(img);
  });
  updateReady();
});

['title','price','writeup','neighborhood'].forEach(id => {
  $(id).addEventListener('input', () => { updateReady(); if(id==='price') updateSpeed(); });
});

function buildText(){
  const title = $('title').value.trim();
  const price = $('price').value;
  const hood = $('neighborhood').value.trim();
  const body = $('writeup').value.trim();
  return `${title}\n$${price}\n\n${body}\n\nLocal pickup near ${hood}. Cash or Zelle.`;
}

$('copyBtn').onclick = async () => {
  try{
    await navigator.clipboard.writeText(buildText());
    toast('Write-up copied');
  }catch(e){ toast('Copy failed'); }
};

$('shareBtn').onclick = async () => {
  const text = buildText();
  if(!files.length){ toast('Add a photo first'); return; }
  const shareData = { title: $('title').value || 'Listing', text };
  try{
    if(navigator.canShare && navigator.canShare({ files })){
      shareData.files = files;
      await navigator.share(shareData);
      toast('Shared with photo');
    } else {
      await navigator.share({ text });
      toast('Shared text (photo not supported in this browser)');
    }
  }catch(err){
    if(err.name !== 'AbortError'){
      // fallback
      try{ await navigator.clipboard.writeText(text); toast('Share blocked — write-up copied'); }catch(_){ toast('Share failed'); }
    }
  }
};

// initial
updateReady();
updateSpeed();
</script>
</body>
</html>
