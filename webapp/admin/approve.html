<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#c513b8" />
  <link rel="icon" type="image/svg+xml" href="../chica-favicon.svg" />
  <title>Approve tip — Chicas-Map Admin</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #14110f; }
    body { max-width: 640px; margin: 24px auto; padding: 0 16px; background: #fffcf7; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .sub { color: #7a736b; font-size: 0.9rem; margin-bottom: 20px; }
    label { display: block; font-weight: 700; font-size: 0.8rem; margin: 12px 0 4px; }
    textarea, input[type=password], input[type=text] {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border: 1px solid #e6e1d8; border-radius: 10px; font: inherit;
    }
    textarea { min-height: 180px; font-family: ui-monospace, monospace; font-size: 0.8rem; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    button {
      border: none; border-radius: 10px; padding: 12px 18px; font-weight: 800;
      cursor: pointer; background: #c513b8; color: #fff;
    }
    button.secondary { background: #e6e1d8; color: #14110f; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 0.9rem; }
    .msg.ok { background: #f8def5; color: #7d0b72; }
    .msg.err { background: #fee2e2; color: #7f1d1d; }
    .msg.info { background: #fdf0fb; color: #6e1b64; }
    .preview { background: #fff; border: 1px solid #e6e1d8; border-radius: 12px; padding: 12px; margin-top: 12px; }
    .preview b { display: block; margin-bottom: 4px; }
    .warn { font-size: 0.75rem; color: #92400e; background: #fffbeb; padding: 10px; border-radius: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Approve permit tip</h1>
  <p class="sub">Owner-only. Publishes to <code>permit-tips.json</code> on GitHub so the map can show it.</p>

  <label for="token">GitHub token (session only)</label>
  <input type="password" id="token" placeholder="ghp_… fine-grained: Contents read/write on this repo" autocomplete="off" />
  <p class="warn">
    Create a fine-grained PAT with <b>Contents: Read and write</b> on Chicas-Map only.
    Token stays in this browser tab (sessionStorage) — never emailed. Clear when done.
  </p>

  <label for="tipJson">Tip JSON</label>
  <textarea id="tipJson" spellcheck="false"></textarea>

  <div class="preview" id="preview" hidden></div>

  <div class="row">
    <button type="button" id="btnApprove">Approve &amp; push to map</button>
    <button type="button" class="secondary" id="btnClear">Clear token</button>
  </div>
  <div id="msg" class="msg info" hidden></div>

  <script>
  (function () {
    const OWNER = "Justonejewelry";
    const REPO = "Chicas-Map";
    const PATH = "webapp/data/permit-tips.json";
    const BRANCH = "main";

    const tokenEl = document.getElementById("token");
    const jsonEl = document.getElementById("tipJson");
    const msg = document.getElementById("msg");
    const preview = document.getElementById("preview");

    try {
      const saved = sessionStorage.getItem("yb_gh_token");
      if (saved) tokenEl.value = saved;
    } catch (_) {}

    tokenEl.addEventListener("change", function () {
      try { sessionStorage.setItem("yb_gh_token", tokenEl.value.trim()); } catch (_) {}
    });

    function loadFromHash() {
      const h = location.hash || "";
      const m = h.match(/[#&]tip=([^&]+)/);
      if (!m) return;
      try {
        const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
        const json = decodeURIComponent(escape(atob(b64)));
        jsonEl.value = JSON.stringify(JSON.parse(json), null, 2);
        renderPreview();
        show("Tip loaded from email link. Review, then Approve.", "info");
      } catch (e) {
        show("Could not decode tip from link: " + e.message, "err");
      }
    }

    function show(text, kind) {
      msg.hidden = false;
      msg.className = "msg " + (kind || "info");
      msg.textContent = text;
    }

    function renderPreview() {
      try {
        const t = JSON.parse(jsonEl.value);
        preview.hidden = false;
        preview.innerHTML =
          "<b>" + esc(t.address || "?") + "</b>" +
          "<div>Schedule: " + esc(t.schedule || "—") + "</div>" +
          "<div>For sale: " + esc(t.summary || "—") + "</div>" +
          (t.permit_number ? "<div>Permit: " + esc(t.permit_number) + "</div>" : "");
      } catch (_) {
        preview.hidden = true;
      }
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    jsonEl.addEventListener("input", renderPreview);
    loadFromHash();
    renderPreview();

    document.getElementById("btnClear").addEventListener("click", function () {
      tokenEl.value = "";
      try { sessionStorage.removeItem("yb_gh_token"); } catch (_) {}
      show("Token cleared from this session.", "info");
    });

    document.getElementById("btnApprove").addEventListener("click", async function () {
      const token = tokenEl.value.trim();
      if (!token) {
        show("Paste your GitHub token first.", "err");
        return;
      }
      let tip;
      try {
        tip = JSON.parse(jsonEl.value);
      } catch (e) {
        show("Invalid JSON: " + e.message, "err");
        return;
      }
      if (!tip.address || !tip.schedule) {
        show("Tip needs at least address and schedule.", "err");
        return;
      }
      tip.status = "published";
      tip.published_at = new Date().toISOString();
      tip.published_via = "admin_approve_page";

      const btn = document.getElementById("btnApprove");
      btn.disabled = true;
      show("Publishing…", "info");

      try {
        const getUrl = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + PATH + "?ref=" + BRANCH;
        const getRes = await fetch(getUrl, {
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + token,
            "X-GitHub-Api-Version": "2022-11-28",
          },
        });
        if (!getRes.ok) throw new Error("Read failed: " + getRes.status + " " + (await getRes.text()));
        const file = await getRes.json();
        const current = JSON.parse(atob(file.content.replace(/\n/g, "")));
        if (!Array.isArray(current.tips)) current.tips = [];

        const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
        const addr = norm(tip.address);
        const pmt = norm(tip.permit_number);
        current.tips = current.tips.filter((t) => {
          const sameAddr = addr && norm(t.address) === addr;
          const samePmt = pmt && norm(t.permit_number) === pmt;
          return !(sameAddr || samePmt);
        });
        current.tips.push(tip);
        current.updated = new Date().toISOString().slice(0, 10);

        const body = JSON.stringify(current, null, 2) + "\n";
        const content = btoa(unescape(encodeURIComponent(body)));

        const putRes = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + PATH, {
          method: "PUT",
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + token,
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message: "Publish moderated permit tip: " + (tip.address || "").slice(0, 60),
            content: content,
            sha: file.sha,
            branch: BRANCH,
          }),
        });
        if (!putRes.ok) throw new Error("Write failed: " + putRes.status + " " + (await putRes.text()));

        show("Published. Map will show this tip after a refresh (often <1 min).", "ok");
        msg.innerHTML = 'Published. <a href="../map.html">Open map</a> and hard-refresh. Tip: ' + esc(tip.address);
        msg.className = "msg ok";
        msg.hidden = false;
      } catch (e) {
        show(String(e.message || e), "err");
      } finally {
        btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
