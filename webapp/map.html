<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chica · Garage Sale Map</title>
  <meta name="description" content="Chica maps the best garage and estate sales in San Antonio and across Texas." />
  <meta name="theme-color" content="#166534" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/grass.css" />
  <link rel="stylesheet" href="css/map-clean.css" />
  <style>
    .maplibregl-popup-content {
      background: #fff; color: #0f172a; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15,23,42,0.12); border: 1px solid #e2e8f0;
      padding: 12px 14px; font-family: inherit; min-width: 180px;
    }
    .maplibregl-popup-close-button { font-size: 18px; padding: 4px 8px; color: #64748b; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    .yb-marker {
      width: 18px; height: 18px; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg); border: 2.5px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); cursor: pointer;
    }
    .yb-marker.garage { background: #22c55e; }
    .yb-marker.estate { background: #a855f7; }
    .yb-marker.fundraiser { background: #f59e0b; }
    .yb-marker.permit { background: #38bdf8; }
    .yb-marker.top { background: #f59e0b; width: 20px; height: 20px; }
    .yb-user-dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: #2563eb; border: 3px solid #fff;
      box-shadow: 0 0 0 4px rgba(37,99,235,0.25), 0 2px 8px rgba(0,0,0,0.3);
    }
    .logo-mark.img {
      width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(22,101,52,0.3); object-fit: cover;
    }
    /* keep chips in DOM for JS, hide visually */
    .chips { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  </style>
</head>
<body class="grass-map">
  <header class="topbar">
    <a class="brand" href="index.html" style="text-decoration:none;color:inherit">
      <img class="logo-mark img" src="assets/chica/smile.jpg" alt="Chica" width="40" height="40" />
      <div>
        <h1>Chica <span>Map</span></h1>
      </div>
    </a>
    <div class="controls">
      <label class="ctrl">
        <select id="citySelect" class="clean-select" title="City">
          <option value="san-antonio">San Antonio</option>
          <option value="austin">Austin</option>
          <option value="houston">Houston</option>
          <option value="dallas">Dallas</option>
          <option value="lubbock">Lubbock</option>
          <option value="texas">Texas (all)</option>
        </select>
      </label>
      <label class="ctrl">
        <select id="mapEngine" class="clean-select" title="Map style">
          <option value="liberty">Street</option>
          <option value="bright">Bright</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <div class="menu-wrap" id="menuWrap">
        <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false">Menu ▾</button>
        <div class="menu-drop" id="menuDrop">
          <a href="index.html">Home</a>
          <a href="backyard.html">Backyard</a>
          <a href="sponsor.html">Sponsor</a>
          <button type="button" id="menuExport">Export list</button>
        </div>
      </div>
      <div class="meta" id="editionMeta">…</div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <section class="near-bar" id="nearBar">
        <div class="near-row">
          <button type="button" class="near-btn primary" id="btnNearMe">📍 Near me</button>
          <select id="radiusSelect" class="radius-select" title="Radius">
            <option value="5">5 mi</option>
            <option value="10" selected>10 mi</option>
            <option value="25">25 mi</option>
            <option value="50">50 mi</option>
            <option value="0">Any</option>
          </select>
        </div>
        <div class="near-row">
          <input type="text" id="locInput" class="loc-input" placeholder="ZIP or address" enterkeyhint="search" />
          <button type="button" class="near-btn" id="btnLocSearch">Go</button>
        </div>
        <div class="near-status" id="nearStatus" hidden></div>
      </section>

      <section class="tools-bar">
        <button type="button" class="tool-btn" id="btnFavorites">★ Saved <span id="favCount">0</span></button>
        <button type="button" class="tool-btn" id="btnRoute">🧭 Route <span id="routeCount">0</span></button>
        <button type="button" class="tool-btn" id="btnExport" hidden>Export</button>
      </section>

      <section class="filters">
        <input type="search" id="search" placeholder="Search sales…" />
        <select id="filterSelect" title="Filter by type">
          <option value="all">All types</option>
          <option value="garage">Garage</option>
          <option value="estate">Estate</option>
          <option value="permit">Permit</option>
          <option value="fundraiser">Fundraiser</option>
          <option value="photos">With photos</option>
        </select>
        <div class="chips" aria-hidden="true">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="garage">Garage</button>
          <button class="chip" data-filter="estate">Estate</button>
          <button class="chip" data-filter="permit">Permit</button>
          <button class="chip" data-filter="fundraiser">Fundraiser</button>
          <button class="chip" data-filter="photos">📷 Photos</button>
        </div>
      </section>

      <details class="panel-block" id="forecastBlock">
        <summary>Weekend forecast</summary>
        <div class="block-body">
          <div id="hotZones"></div>
          <div class="quick-areas" id="quickAreas"></div>
        </div>
      </details>

      <section class="list-wrap">
        <div class="list-head">
          <h2 id="listTitle">Sales</h2>
          <span id="listCount">0</span>
        </div>
        <ul id="saleList" class="sale-list"></ul>
      </section>

      <div id="detailDrawer" class="detail-drawer hidden">
        <button type="button" id="detailClose" class="detail-close" aria-label="Close">×</button>
        <div id="detailBody"></div>
      </div>
      <div id="routeTray" class="route-tray hidden">
        <div class="route-head">
          <strong>Route</strong>
          <button type="button" class="near-btn clear-loc" id="btnClearRoute">Clear</button>
        </div>
        <ol id="routeStops" class="route-stops"></ol>
        <button type="button" class="near-btn primary" id="btnOpenRoute" style="width:100%;margin-top:8px">Open in Google Maps</button>
      </div>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-legend">
        <span><i class="pin top"></i> Top</span>
        <span><i class="pin new"></i> Garage</span>
        <span><i class="pin estate"></i> Estate</span>
        <span><i class="pin permit"></i> Permit</span>
      </div>
      <div class="map-hint" id="mapHint">Near me or enter a ZIP to sort by distance</div>
    </section>
  </main>

  <footer class="footer">
    <span id="footerSources">Chica · YardBird</span>
    <span><a href="backyard.html">Backyard</a> · <a href="sponsor.html">Sponsor</a></span>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <div class="yowl-ambassador" id="chicaAmbassador" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
  <script>
  (function () {
    // Menu dropdown
    var wrap = document.getElementById('menuWrap');
    var btn = document.getElementById('menuBtn');
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = wrap.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', function () {
      wrap.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    });

    // Filter dropdown → existing chip buttons (app.js listens to chips)
    var filterSelect = document.getElementById('filterSelect');
    filterSelect.addEventListener('change', function () {
      var val = filterSelect.value;
      var chip = document.querySelector('.chip[data-filter="' + val + '"]');
      if (chip) chip.click();
    });

    // Menu export → hidden export button
    document.getElementById('menuExport').addEventListener('click', function () {
      document.getElementById('btnExport').click();
      wrap.classList.remove('open');
    });
  })();
  </script>
</body>
</html>
