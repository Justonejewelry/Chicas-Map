<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Garage Sales Near Me — Live San Antonio Map | Chica Map</title>
  <meta name="description" content="Find verified garage sales, yard sales, and estate sales near you in San Antonio." />
  <meta name="theme-color" content="#1a6b3c" />
  <link rel="canonical" href="https://justonejewelry.github.io/Chicas-Map/map.html" />
  <script>
  (async function () {
    var src = "https://cdn.jsdelivr.net/gh/Justonejewelry/Chicas-Map@5e21ee7d2857944983914be34dc19babe4d56e85/webapp/map.html";
    var res = await fetch(src + "?t=" + Date.now());
    if (!res.ok) throw new Error("fetch failed " + res.status);
    var html = await res.text();
    html = html.replace("js/layers-rail.js?v=depth1", "js/layers-rail.js?v=depth3");
    html = html.replace('src="js/public-wifi-layer.js"', 'src="js/public-wifi-layer.js?v=wifi3"');
    html = html.replace('src="js/food-pantry-layer.js"', 'src="js/food-pantry-layer.js?v=pantry2"');
    if (html.indexOf("preferred-overlay") < 0) {
      html = html.replace(
        '<script src="js/user-overlay.js"><\/script>',
        '<script src="js/user-overlay.js"><\/script>\n  <script src="js/preferred-overlay.js?v=pref1"><\/script>'
      );
    }
    if (html.indexOf("layer-timing-fix.js") < 0) {
      html = html.replace(
        "js/layers-rail.js?v=depth3\"></script>",
        "js/layers-rail.js?v=depth3\"></script>\n  <script src=\"js/layer-timing-fix.js?v=lt1\"></script>"
      );
    }
    document.open();
    document.write(html);
    document.close();
  })().catch(function (e) {
    document.body.innerHTML =
      '<p style="font-family:system-ui;padding:2rem">Could not load map. Hard-refresh or open the <a href="https://github.com/Justonejewelry/Chicas-Map">repo</a>.</p>';
    console.error(e);
  });
  </script>
</head>
<body>
  <p style="font-family:system-ui;padding:2rem">Loading Chica Map…</p>
</body>
</html>
