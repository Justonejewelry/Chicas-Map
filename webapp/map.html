<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Garage Sales Near Me — Live San Antonio Map | Chica Map</title>
  <meta name="description" content="Find verified garage sales, yard sales, and estate sales near you in San Antonio." />
  <meta name="theme-color" content="#1a6b3c" />
  <link rel="canonical" href="https://justonejewelry.github.io/Chicas-Map/map.html" />
  <style>
    html,body{margin:0;height:100%;height:100dvh;background:#e8f2ec;overflow:hidden}
    #chica-boot{position:fixed;inset:0;display:grid;place-items:center;font:600 15px/1.4 system-ui,sans-serif;color:#145530}
  </style>
  <script>
  (async function () {
    var src = "https://cdn.jsdelivr.net/gh/Justonejewelry/Chicas-Map@5e21ee7d2857944983914be34dc19babe4d56e85/webapp/map.html";
    var res = await fetch(src + "?t=" + Date.now());
    if (!res.ok) throw new Error("fetch failed " + res.status);
    var html = await res.text();

    html = html.split("js/layers-rail.js?v=depth1").join("js/layers-rail.js?v=depth4");
    html = html.split('src="js/public-wifi-layer.js"').join('src="js/public-wifi-layer.js?v=wifi7"');
    html = html.split('src="js/food-pantry-layer.js"').join('src="js/food-pantry-layer.js?v=pantry4"');

    var close = "<" + "/script>";

    if (html.indexOf("preferred-overlay") < 0) {
      html = html.split('<script src="js/user-overlay.js">' + close).join(
        '<script src="js/user-overlay.js">' + close + "\n  " +
        '<script src="js/preferred-overlay.js?v=pref1">' + close
      );
    }
    if (html.indexOf("layer-timing-force.js") < 0) {
      html = html.split('js/layers-rail.js?v=depth4">' + close).join(
        'js/layers-rail.js?v=depth4">' + close + "\n  " +
        '<script src="js/layer-timing-force.js?v=lt2">' + close
      );
    }
    if (html.indexOf("cls-force.css") < 0) {
      html = html.split("</head>").join('<link rel="stylesheet" href="css/cls-force.css?v=cls1" />\n</head>');
    }
    if (html.indexOf("chica-config.js") < 0) {
      html = html.split("</body>").join('<script src="js/chica-config.js?v=cfg1">' + close + "\n</body>");
    }
    if (html.indexOf("chica-analytics.js") < 0) {
      html = html.split("</body>").join('<script src="js/chica-analytics.js?v=an1">' + close + "\n</body>");
    }
    if (html.indexOf("web-vitals-monitor.js") < 0) {
      html = html.split("</body>").join('<script src="js/web-vitals-monitor.js?v=cwv1">' + close + "\n</body>");
    }
    if (html.indexOf("layer-worker-client.js") < 0) {
      html = html.split('src="js/public-wifi-layer.js').join(
        'src="js/layer-worker-client.js?v=lw1">' + close + "\n  <script src=\"js/public-wifi-layer.js"
      );
    }
    // Zone Aware — school zones + calm voice alerts
    if (html.indexOf("zone-aware-layer.js") < 0) {
      html = html.split('src="js/food-pantry-layer.js?v=pantry4">' + close).join(
        'src="js/food-pantry-layer.js?v=pantry4">' + close + "\n  <script src=\"js/zone-aware-layer.js?v=zone1\">' + close
      );
      if (html.indexOf("zone-aware-layer.js") < 0) {
        html = html.split("</body>").join(
          '<script src="js/zone-aware-layer.js?v=zone1">' + close + "\n</body>"
        );
      }
    }

    document.open();
    document.write(html);
    document.close();
  })().catch(function (e) {
    document.body.innerHTML =
      '<p style="font-family:system-ui;padding:2rem">Could not load map. Hard-refresh or open the <a href="https://github.com/Justonejewelry/Chicas-Map">repo</a>.</p>';
    console.error(e);
  });
  </script>
</head>
<body>
  <div id="chica-boot">Loading Chica Map…</div>
</body>
</html>
