<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Garage Sales Near Me — Live San Antonio Map | Chica Map</title>
  <meta name="description" content="Find verified garage sales, yard sales, and estate sales near you in San Antonio." />
  <meta name="theme-color" content="#c513b8" />
  <link rel="canonical" href="https://justonejewelry.github.io/Chicas-Map/map.html" />
  <style>html,body{margin:0;height:100%;height:100dvh;background:#e8f2ec;overflow:hidden}#chica-boot{position:fixed;inset:0;display:grid;place-items:center;font:600 15px/1.4 system-ui,sans-serif;color:#145530}</style>
  <script>
  (async function () {
    var t = Date.now();
    var parts = await Promise.all([
      fetch("map-b64-a.txt?t=" + t, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("a"); return r.text(); }),
      fetch("map-b64-b.txt?t=" + t, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("b"); return r.text(); })
    ]);
    var html = decodeURIComponent(escape(atob(parts[0].trim() + parts[1].trim())));
    document.open();
    document.write(html);
    document.close();
  })().catch(function (e) {
    document.body.innerHTML = '<p style="font-family:system-ui;padding:2rem">Could not load map. Hard-refresh or open the <a href="https://github.com/Justonejewelry/Chicas-Map">repo</a>.</p>';
    console.error(e);
  });
  </script>
</head>
<body><div id="chica-boot">Loading Chica Map…</div></body>
</html>
