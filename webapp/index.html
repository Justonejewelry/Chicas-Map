<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yowl Lawnda · Garage Sale Forecaster</title>
  <meta name="description" content="Yowl Lawnda maps the best garage sales in San Antonio and across Texas. Weekly updates. Top picks. New sales." />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo-mark" aria-hidden="true">🐕</div>
      <div>
        <h1>Yowl <span>Lawnda</span></h1>
        <p class="tag">Garage Sale Forecaster · Texas</p>
      </div>
    </div>
    <div class="controls">
      <label class="ctrl">City
        <select id="citySelect">
          <option value="san-antonio">San Antonio</option>
          <option value="austin">Austin</option>
          <option value="houston">Houston</option>
          <option value="dallas">Dallas</option>
          <option value="lubbock">Lubbock</option>
          <option value="texas">Texas (all)</option>
        </select>
      </label>
      <label class="ctrl">Map
        <select id="mapEngine">
          <option value="leaflet-voyager">Street · Bright</option>
          <option value="leaflet-osm">Street · Classic</option>
          <option value="leaflet-carto">Street · Dark</option>
        </select>
      </label>
      <div class="meta" id="editionMeta">Loading…</div>
    </div>
  </header>
  <main class="layout">
    <aside class="panel">
      <section class="hero-chip"><span class="pulse"></span> Howdy — weekly map is live</section>
      <section class="forecast"><h2>Weekend Forecast</h2><div id="hotZones"></div></section>
      <section class="filters">
        <input type="search" id="search" placeholder="Search address, neighborhood, zip…" />
        <div class="chips">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="garage">Garage</button>
          <button class="chip" data-filter="estate">Estate</button>
          <button class="chip" data-filter="permit">Permit</button>
          <button class="chip" data-filter="fundraiser">Fundraiser</button>
        </div>
      </section>
      <section class="list-wrap">
        <div class="list-head"><h2>Locations</h2><span id="listCount">0</span></div>
        <ul id="saleList" class="sale-list"></ul>
      </section>
      <div id="detailDrawer" class="detail-drawer hidden">
        <button type="button" id="detailClose" class="detail-close" aria-label="Close">×</button>
        <div id="detailBody"></div>
      </div>
    </aside>
    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-legend">
        <span><i class="pin top"></i> Top Pick</span>
        <span><i class="pin new"></i> New Sale</span>
        <span><i class="pin estate"></i> Estate</span>
        <span><i class="pin permit"></i> Permit cluster</span>
      </div>
      <div class="map-hint" id="mapHint">Tap a red cluster to see every address inside</div>
    </section>
  </main>
  <footer class="footer">
    <span id="footerSources">YardBird · GSIN · San Antonio first</span>
    <a href="https://github.com/Justonejewelry/Project-YardBird" target="_blank" rel="noopener">GitHub</a>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
