<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chicas Map — Maintenance</title>
  <meta name="theme-color" content="#121212" />
  <link rel="icon" type="image/svg+xml" href="/Chicas-Map/favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #121212;
      color: #f5f5f0;
      font-family: Inter, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 420px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c513af;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 1.85rem;
      line-height: 1.15;
      margin-bottom: 0.85rem;
    }
    p {
      color: #a3a39a;
      font-size: 1rem;
      line-height: 1.55;
      margin-bottom: 1.75rem;
    }
    .links a {
      display: inline-block;
      margin: 0 0.4rem;
      color: #c513af;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
    .foot {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #6b6b63;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Chicas Map</div>
    <h1>Quick maintenance</h1>
    <p>The map is temporarily offline while we finish recovering a few files.<br>Everything will be back shortly.</p>
    <div class="links">
      <a href="https://www.facebook.com/groups/chicasmap" target="_blank" rel="noopener">Facebook pack</a>
      ·
      <a href="/Chicas-Map/">Refresh</a>
    </div>
    <p class="foot">Sorry for the interruption — the pins are coming back.</p>
  </div>
</body>
</html>
