  <script>
  (function () {
    var orig = window.fetch;
    window.fetch = async function (input, init) {
      var res = await orig.apply(this, arguments);
      try {
        var url = typeof input === "string" ? input : (input && input.url) || "";
        if (/data\/cities\/[a-z0-9-]+\.json/.test(url) && !/-user\.json/.test(url) && window.YardBirdUserOverlay) {
          var city = (url.match(/cities\/([a-z0-9-]+)\.json/) || [])[1];
          if (city && city !== "texas") {
            var data = await res.clone().json();
            if (window.ChicaBoostPins) data = window.ChicaBoostPins.ingestFeed(data);
            var merged = await YardBirdUserOverlay.mergeUserOverlay(city, data);
            if (window.ChicaBoostPins) merged = window.ChicaBoostPins.ingestFeed(merged);
            return new Response(JSON.stringify(merged), {
              status: res.status,
              statusText: res.statusText,
              headers: { "Content-Type": "application/json" },
            });
          }
        }
      } catch (e) {}
      return res;
    };
  })();
  </script>
