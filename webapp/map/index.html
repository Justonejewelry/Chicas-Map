<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="origin" />
  <title>The map · Chicas Map</title>
  <meta name="description" content="San Antonio garage, yard, and estate sales. Near Me, layers, and one-tap directions." />
  <meta name="theme-color" content="#121212" />
  <link rel="icon" type="image/svg+xml" href="/Chicas-Map/favicon.svg" />
  <link rel="apple-touch-icon" href="/Chicas-Map/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #121212; color: #f3eee4; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
    #chica-live-map { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; background: #121212; }
    .leaflet-container { width: 100% !important; height: 100% !important; background: #121212; }
    .leaflet-pane, .leaflet-map-pane, .leaflet-tile-pane, .leaflet-overlay-pane { width: 100%; height: 100%; }
    .leaflet-container img.leaflet-tile { max-width: none !important; }
    .chica-pin, .chica-overlay-pin { background: transparent !important; border: 0 !important; }
    #chica-home-chip {
      position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px;
      z-index: 2147483646; height: 42px; padding: 0 12px; border-radius: 12px;
      background: #1a1714f5; color: #f3eee4; text-decoration: none;
      font: 800 12px/42px Inter, system-ui, sans-serif; border: 1px solid #3a342e;
      pointer-events: auto;
    }
    .leaflet-control-zoom { margin-bottom: 92px !important; }
  </style>
</head>
<body>
  <div id="chica-live-map" class="chica-map"></div>
  <a id="chica-home-chip" href="/Chicas-Map/">Home</a>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/Chicas-Map/js/chica-config.js?v=3"></script>
  <script src="/Chicas-Map/js/chica-core.js?v=4"></script>
  <script src="/Chicas-Map/js/chica-live-map.js?v=2"></script>
  <script src="/Chicas-Map/js/click-fix.js?v=4"></script>
  <script src="/Chicas-Map/js/force-key.js?v=5"></script>
  <script src="/Chicas-Map/js/hunt-bar.js?v=4"></script>
  <script src="/Chicas-Map/js/map-cta.js?v=9"></script>
  <script src="/Chicas-Map/js/pin-pop.js?v=6"></script>
  <script src="/Chicas-Map/js/key-clicks.js?v=8"></script>
  <script src="/Chicas-Map/js/claimed-pins.js?v=4"></script>
</body>
</html>
