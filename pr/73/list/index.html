<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>This weekend’s sales · Chicas Map</title>
  <meta name="description" content="San Antonio garage sales and estate sales for this weekend. Open a pin on the map." />
  <link rel="icon" type="image/svg+xml" href="/Chicas-Map/preview/73/favicon.svg" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #121212; color: #f3eee4; }
    main { max-width: 720px; margin: 0 auto; padding: 28px 18px 80px; }
    a { color: #c513af; }
    h1 { font-family: Syne, Inter, sans-serif; margin: 8px 0 6px; }
    .meta { color: #c4b8a8; }
    .row { display: block; min-height: 44px; padding: 14px 0; border-bottom: 1px solid #2a2622; text-decoration: none; color: inherit; }
    .row:hover { color: #fff; }
    .kind { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #c513af; }
    .nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; } .nav a { display: inline-flex; align-items: center; min-height: 44px; } a:focus-visible { outline: 2px solid #c513af; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="meta">Chicas Map · San Antonio</p>
    <h1>This weekend’s sales</h1>
    <p class="meta" id="status">Loading the live feed…</p>
    <p class="nav"><a href="/Chicas-Map/preview/73/calendar/" id="calendar-link">Sales calendar</a> · <a href="/Chicas-Map/preview/73/map/">Open the map</a> · <a href="/Chicas-Map/preview/73/submit/">List a sale</a> · <a href="/Chicas-Map/preview/73/claim/">Boost My Sale</a> · <a href="/Chicas-Map/preview/73/garage-sales/">By neighborhood</a></p>
    <div id="list"></div>
  </main>
  <script>
    (function () {
      var calendarLink = document.getElementById("calendar-link");
      if (document.documentElement.lang === "es" || location.pathname.indexOf("/es/") !== -1) {
        calendarLink.href = "/Chicas-Map/preview/73/es/calendar/";
        calendarLink.textContent = "Calendario de ventas";
      }
      var box = document.getElementById("list");
      var status = document.getElementById("status");
      var urls = ["/Chicas-Map/preview/73/data/sales-clean.json?v=" + Date.now()];
      function bag(data) {
        var sales = [];
        if (Array.isArray(data)) sales = data;
        else if (data && Array.isArray(data.sales)) sales = data.sales;
        else if (data && Array.isArray(data.features)) {
          sales = data.features.map(function (f) {
            var p = f.properties || {};
            var c = (f.geometry && f.geometry.coordinates) || [];
            return {
              title: p.title || p.name || "Sale",
              type: p.type || p.kind || "garage",
              address: p.address || p.addr || "",
              lat: c[1], lon: c[0]
            };
          });
        } else if (data && (Array.isArray(data.public) || Array.isArray(data.permits))) {
          sales = [].concat(data.public || [], data.permits || []);
        }
        if (Array.isArray(data) || (data && Array.isArray(data.sales)) ||
            (data && Array.isArray(data.features)) ||
            (data && (Array.isArray(data.public) || Array.isArray(data.permits))) {
          return sales;
        }
        return null;
      }
      fetch(urls[0], { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("Feed request failed: " + r.status);
          return r.json();
        })
        .then(function (data) {
        var sales = bag(data);
        if (!sales) throw new Error("Feed data has an unexpected format");
        // Hide sales whose last day has passed (America/Chicago)
        var today = "";
        try { today = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago" }).format(new Date()); } catch (e) {}
        if (today) sales = sales.filter(function (s) {
          var end = String(s.date_end || s.end_date || s.date_to || "").slice(0, 10);
          return !/^\d{4}-\d{2}-\d{2}$/.test(end) || end >= today;
        });
        status.textContent = sales.length
          ? sales.length + " stops in the live San Antonio feed."
          : "No upcoming garage or estate sales are currently in the live feed.";
        function esc(v) {
          return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
            return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
          });
        }
        box.innerHTML = sales.map(function (s) {
          var title = esc(s.title || s.name || "Sale");
          var rawKind = String(s.type || s.kind || "garage").toLowerCase().replace(/[\s_-]+/g, "");
          var kind = rawKind === "estate" || rawKind === "estatesale" ? "Estate Sale" : rawKind === "permit" ? "City Permit" : "Garage Sale";
          var addr = esc(s.address || s.addr || "");
          var href = "/Chicas-Map/preview/73/map/";
          var lat = Number(s.lat), lon = Number(s.lon != null ? s.lon : s.lng);
          if (isFinite(lat) && isFinite(lon) && s.lat != null) {
            var id = s.external_id || s.id || s.sale_id || (lat.toFixed(5) + "," + lon.toFixed(5) + "|" + (s.title || s.address || ""));
            href += "?sale=" + encodeURIComponent(id);
          }
          if (s.dates) addr += (addr ? " \u00b7 " : "") + esc(s.dates);
          return '<a class="row" href="' + href + '"><div class="kind">' + kind + '</div><strong>' + title + '</strong><div class="meta">' + addr + '</div></a>';
        }).join("");
      }).catch(function () {
        status.textContent = "Live sales are temporarily unavailable. Please try again or open the map.";
        box.innerHTML = '<a class="row" href="/Chicas-Map/preview/73/list/">Try loading the sales list again</a>';
      });
    })();
  </script>
<script src="/Chicas-Map/preview/73/js/chica-menu.js?v=11" defer></script>
<script data-goatcounter="https://chicasmapcom.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
