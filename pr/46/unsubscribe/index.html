<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Unsubscribe · Chicas Map</title>
<style>body{font:16px/1.5 Inter,system-ui,sans-serif;background:#14110f;color:#f3eee4;max-width:520px;margin:40px auto;padding:0 20px;text-align:center}button{min-height:44px;padding:0 20px;border-radius:999px;border:0;background:#c513af;color:#fff;font-weight:700;cursor:pointer}a{color:#ed65dc}</style></head>
<body><h1>🐾</h1><p id="m">Stop Chica's email alerts for <b id="e"></b>?<br><span lang="es">¿Dejar de recibir las alertas de Chica?</span></p>
<button id="b">Unsubscribe / Cancelar</button><p id="r" aria-live="polite"></p><p><a href="/">chicasmap.com</a></p>
<script>
var FORM = "https://formsubmit.co/ajax/2f6534a8c454b090116f8050045f0e26", MAILTO = ""; // keep in sync with js/home-search.js ALERTS
var p = new URLSearchParams(location.search), t = p.get("t") || "", em = p.get("e") || "";
document.getElementById("e").textContent = em;
document.getElementById("b").onclick = function () {
  var r = document.getElementById("r");
  if (FORM) { var fd = new FormData(); fd.append("email", em); fd.append("token", t); fd.append("action", "unsubscribe"); fd.append("_subject", "Chica alerts UNSUBSCRIBE " + t); fd.append("_captcha", "false");
    fetch(FORM, { method: "POST", body: fd, headers: { Accept: "application/json" } }).then(function () { r.textContent = "Done — you won't get more alerts. ¡Listo, ya no recibirás alertas! 💜"; }); }
  else if (MAILTO) { location.href = "mailto:" + MAILTO + "?subject=" + encodeURIComponent("Chica alerts UNSUBSCRIBE " + t); r.textContent = "Send that email and you're out. / Envía ese correo y listo."; }
  else r.textContent = "Reply STOP to any alert email. / Responde STOP a cualquier alerta.";
};
</script></body></html>
