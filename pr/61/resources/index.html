<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alamo City Resources · San Antonio</title>
  <meta name="description" content="Pantries, free Wi-Fi, parking, school zones, and everyday utility pins for San Antonio. Separate from Chicas Map sales." />
  <link rel="stylesheet" href="/Chicas-Map/preview/61/vendor/leaflet-1.9.4/leaflet.css" />
  <style>
    html, body { margin: 0; width: 100vw; height: 100dvh; background: #0f1419; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    #resources-map { position: fixed; inset: 0; width: 100vw; height: 100dvh; background: #0f1419; }
    #boot { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f1419; color: #e8e6e3; }
    #boot.done { opacity: 0; pointer-events: none; transition: opacity .3s; }
    .dot { width: 24px; height: 24px; border-radius: 50%; background: #2a9d8f; box-shadow: 0 0 0 6px #2a9d8f33; }
    .copy { font: 700 15px/1.2 Inter, system-ui, sans-serif; margin-top: 12px; }
    .sub { font: 500 12px/1.3 Inter, system-ui, sans-serif; color: #a0a0a0; margin-top: 4px; }
    #menu { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 1001; }
    #menu summary { list-style: none; height: 44px; padding: 0 14px; border-radius: 12px; background: #2a9d8f; color: #fff; font: 700 13px/44px Inter, system-ui, sans-serif; cursor: pointer; }
    #menu nav { position: absolute; right: 0; top: 48px; min-width: 180px; background: #1a1f24; border: 1px solid #2a3036; border-radius: 12px; padding: 6px; }
    #menu a { display: block; padding: 12px; color: #e8e6e3; text-decoration: none; font: 600 14px/1.2 Inter, system-ui, sans-serif; border-radius: 8px; }
    #menu a:hover { background: #2a3036; }
    .resource-legend {
      background: #1a1f24ee;
      border: 1px solid #2a3036;
      border-radius: 12px;
      padding: 10px 12px;
      color: #e8e6e3;
      font: 600 13px/1.3 Inter, system-ui, sans-serif;
      backdrop-filter: blur(6px);
      max-height: 70dvh;
      overflow-y: auto;
    }
    .legend-title { font-weight: 700; font-size: 12px; letter-spacing: .02em; margin-bottom: 8px; color: #a0a0a0; text-transform: uppercase; }
    .legend-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    .legend-row input { accent-color: #2a9d8f; width: 16px; height: 16px; }
    .legend-icon { display: flex; align-items: center; }
    .resource-pin { background: none !important; border: none !important; }
  </style>
</head>
<body>
  <div id="resources-map" role="application" aria-label="Alamo City Resources map"></div>
  <div id="boot" role="status">
    <span class="dot"></span>
    <div class="copy">Loading resources…</div>
    <div class="sub">Alamo City Resources</div>
  </div>
  <details id="menu">
    <summary>Menu</summary>
    <nav>
      <a href="/Chicas-Map/preview/61/">Chicas Map (sales)</a>
      <a href="/Chicas-Map/preview/61/atlas/">Alamo Atlas</a>
      <a href="/Chicas-Map/preview/61/">Home</a>
    </nav>
  </details>
  <script src="/Chicas-Map/preview/61/vendor/leaflet-1.9.4/leaflet.js"></script>
  <script src="/Chicas-Map/preview/61/js/resources-map.js?v=3"></script>
</body>
</html>
