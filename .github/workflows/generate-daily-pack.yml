name: Generate Daily Pack

on:
  schedule:
    # Thursday 23:00 UTC = 6pm CDT
    - cron: "0 23 * * 4"
    # Friday 23:00 UTC = 6pm CDT
    - cron: "0 23 * * 5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date (YYYY-MM-DD). Leave empty for auto."
        required: false
        default: ""
      reason:
        description: "Why is this manual run?"
        required: false
        default: "manual"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-pack
  cancel-in-progress: true

jobs:
  generate-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pack
        id: pack
        run: |
          set -euo pipefail
          python3 scripts/content-packs/generate-pack.py \
            ${{ github.event.inputs.target_date && format('--date {0}', github.event.inputs.target_date) || '' }} \
            --output-dir packs \
            --repo-mode

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- packs/; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- packs/
          fi

      - name: Commit pack
        if: steps.diff.outputs.dirty == 'true'
        run: |
          git config user.name "yardbird-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/
          git commit -m "chore(packs): daily pack $(date -u +%Y-%m-%d) [skip ci]" || exit 0
          git push

      - name: Create Issue with pack content
        if: steps.diff.outputs.dirty == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const packsDir = 'packs';
            const dirs = fs.readdirSync(packsDir).filter(d => fs.statSync(path.join(packsDir, d)).isDirectory()).sort().reverse();
            if (dirs.length === 0) {
              console.log('No pack directories found');
              return;
            }
            const latest = dirs[0];
            const packPath = path.join(packsDir, latest, 'pack.md');
            if (!fs.existsSync(packPath)) {
              console.log('pack.md not found in', latest);
              return;
            }
            const body = fs.readFileSync(packPath, 'utf8');
            const title = `Chica Daily Pack — ${latest}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body + '\n\n---\n*Auto-generated by generate-daily-pack workflow*',
              labels: ['daily-pack']
            });
            console.log('Issue created:', title);

      - name: Summary
        run: |
          {
            echo "### Daily Pack Generation"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Changes committed: ${{ steps.diff.outputs.dirty }}"
            echo ""
            ls -la packs/ || true
          } >> "$GITHUB_STEP_SUMMARY"
