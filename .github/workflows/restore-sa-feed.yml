name: Restore SA feed
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Friday pack then drop dirty pins
        run: |
          git checkout c90c99191686bb3052e3e1c460fa80ef57d229b9 -- webapp/data/cities/san-antonio.json
          python3 - <<'PY'
          import json
          SA = (29.4241, -98.4936)
          path = "webapp/data/cities/san-antonio.json"
          d = json.load(open(path))
          def dirty(s):
              lat, lon, conf = s.get("lat"), s.get("lon"), s.get("confidence")
              if lat is None or lon is None:
                  return True
              if abs(float(lat) - SA[0]) < 0.00015 and abs(float(lon) - SA[1]) < 0.00015:
                  return True
              try:
                  c = float(conf)
                  if c <= 1 and c < 0.70:
                      return True
              except Exception:
                  pass
              return False
          pub = [s for s in (d.get("public") or []) if not dirty(s)]
          perm = [s for s in (d.get("permits") or []) if not dirty(s)]
          d["public"] = pub
          d["permits"] = perm
          d["total_locations"] = len(pub) + len(perm)
          d["permit_total"] = len(perm)
          json.dump(d, open(path, "w"), indent=2, ensure_ascii=False)
          print("kept public", len(pub), "permits", len(perm))
          PY
          git config user.name "chicas-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/data/cities/san-antonio.json
          git commit -m "Restore SA feed; drop downtown-center and sub-70 pins" || echo "no change"
          git push
