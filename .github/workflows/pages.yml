name: Deploy Chicas Map webapp to GitHub Pages

on:
  push:
    branches: [main, previews]
    paths:
      - "webapp/**"
      - "scripts/stamp-pages.mjs"
      - "scripts/root-domain.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  # Rapid email-lead merges used to cancel the previous Pages job, which showed as a red X.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout PR previews
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: previews
          path: preview-src

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage webapp as site root
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R webapp/. _site/
          if [ ! -f _site/data/feed.json ] && [ -f webapp/data/cities/san-antonio.json ]; then
            cp webapp/data/cities/san-antonio.json _site/data/feed.json
          fi
          if [ -d preview-src/pr ]; then
            mkdir -p _site/preview
            for dir in preview-src/pr/*; do
              [ -d "$dir" ] || continue
              n=$(basename "$dir")
              rm -rf "_site/preview/$n"
              cp -R "$dir" "_site/preview/$n"
              echo "preview $n"
            done
          fi
          DOMAIN="${{ vars.CUSTOM_DOMAIN }}"
          if [ -z "$DOMAIN" ]; then DOMAIN="www.chicasmap.com"; fi
          echo "$DOMAIN" > _site/CNAME
          echo "custom domain $DOMAIN"
          export SITE_ORIGIN="https://${DOMAIN}"
          node scripts/stamp-pages.mjs _site
          node scripts/root-domain.mjs _site
          # Tip-only prune. These files are not referenced by the live map or adventure page.
          # alamo-atlas-demo.mp4 stays: home-atlas.js links it.
          find _site -type f \( \
            -name 'chica-atlas-reel.mp4' -o \
            -name 'chica-intro.mp4' -o \
            -name 'ee1f65c66a08901e41638ce959cb3fd1.mp4' -o \
            -name 'coin-ching-burst.mp4' -o \
            -name 'leaflet-src-*.js' -o \
            -name 'index-DY1xcPah.js' \
          \) -print -delete
          echo "site bytes $(du -sb _site | cut -f1)"
          ls -la _site
          ls -la _site/es || true
          ls -la _site/.well-known || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
