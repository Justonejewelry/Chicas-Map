name: Restore full map.html

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-full-map-html.py
      - .github/workflows/restore-map-html.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained map.html
        run: python3 scripts/build-full-map-html.py

      - name: Commit restored map.html
        run: |
          git config user.name "chica-map-bot"
          git config user.email "chica-map-bot@users.noreply.github.com"
          git add webapp/map.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(map): full self-contained map.html (automated restore)"
            git push
          fi
