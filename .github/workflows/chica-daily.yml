name: Chica Daily (Master Workflow)

# Unified populate: every map source + orchestrator + events + forecast.
# 5:00 AM America/Chicago every day.
# CDT (UTC-5) → 10:00 UTC | CST (UTC-6) → 11:00 UTC
# Both crons fire near 5 AM local year-round. Idempotent sources.

on:
  schedule:
    - cron: "0 10 * * *"   # ~5 AM CDT daily
    - cron: "0 11 * * *"   # ~5 AM CST daily
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date YYYY-MM-DD (leave empty = today in America/Chicago)"
        required: false
        default: ""
      cities:
        description: "Cities to discover (comma-separated)"
        required: false
        default: "san-antonio,austin"
      permit_days:
        description: "SA permit lookback days"
        required: false
        default: "14"
      dry_run:
        description: "Dry run (no commit / skip writes where supported)"
        required: false
        default: "false"
      reason:
        description: "Why is this manual run?"
        required: false
        default: "manual"

permissions:
  contents: write
  issues: write

concurrency:
  group: chica-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure directories
        run: |
          mkdir -p scripts data/sales daily-packs social forecast reports webapp/data/cities

      - name: Master populate (all source actions)
        id: run
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
          PERMIT_DAYS: ${{ github.event.inputs.permit_days || '14' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="--date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/master_populate.py \
            --cities "$CITIES" \
            --permit-days "$PERMIT_DAYS" \
            $ARGS | tee daily-run.log

      - name: Detect changes
        id: diff
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet -- \
            data/sales daily-packs social forecast reports \
            webapp/data/cities webapp/data/community-events.json \
            webapp/data/scraper-health.json webapp/data/feed.json \
            2>/dev/null; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            git status --short -- \
              data/sales daily-packs social forecast reports \
              webapp/data/cities webapp/data/community-events.json \
              webapp/data/scraper-health.json webapp/data/feed.json || true
          fi

      - name: Commit daily populate
        if: steps.diff.outputs.dirty == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -e
          git config user.name "chicas-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/sales/ daily-packs/ social/ forecast/ reports/ \
            webapp/data/cities/ webapp/data/community-events.json \
            webapp/data/scraper-health.json webapp/data/feed.json \
            || true
          DATE=$(ls data/sales/*.json 2>/dev/null | xargs -n1 basename 2>/dev/null | sed 's/.json//' | sort | tail -1 || date -u +%Y-%m-%d)
          MSG="Chica master populate — ${DATE} [skip ci]"
          git commit -m "$MSG" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "### Chica Daily Master Populate (5 AM CT)"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Cities: ${{ github.event.inputs.cities || 'san-antonio,austin' }}"
            echo "- Target input: ${{ github.event.inputs.target_date || 'auto (today CT)' }}"
            echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}"
            echo "- Changes: ${{ steps.diff.outputs.dirty || 'n/a' }}"
            echo ""
            echo "#### Sources in master_populate.py"
            echo "- GarageSaleFinder discover_sales"
            echo "- City of SA permits"
            echo "- EstateSales.org"
            echo "- YardSaleSearch"
            echo "- gsalr.com"
            echo "- Craigslist"
            echo "- EstateSales.net lightweight (free HTTP)"
            echo "- purge_expired + scraper health"
            echo "- chica_daily orchestrator (enrich / sentinel / packs / social)"
            echo "- community events swarm"
            echo "- populate_forecast + cluster intelligence (if present)"
            echo ""
            echo "#### Run log"
            echo '```'
            cat daily-run.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
