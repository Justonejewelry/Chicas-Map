name: Chica Daily (Master Workflow)

# Single scheduled production pipeline for all map sources, events, and forecast.
# All schedule times use America/Chicago so daylight saving changes are automatic.
# Minutes are off the top of the hour to reduce GitHub Actions schedule delay.
# Map Refresh remains available for manual runs only; do not add a second scraper schedule.
# Feed Watch may re-dispatch this workflow if the public feed is stale.
# Do NOT put [skip ci] on the populate commit. That left GitHub Pages
# serving an empty public[] while main already had pins.

on:
  schedule:
    # Monday–Thursday: 5:13 AM and 1:13 PM Central
    - cron: "13 5,13 * * 1-4"
      timezone: "America/Chicago"

    # Friday–Sunday: 5:13 AM, 7:13 AM, 10:13 AM and 1:13 PM Central
    - cron: "13 5,7,10,13 * * 5,6,0"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date YYYY-MM-DD (leave empty = today in America/Chicago)"
        required: false
        default: ""
      cities:
        description: "Cities to discover (comma-separated)"
        required: false
        default: "san-antonio,austin"
      permit_days:
        description: "SA permit lookback days"
        required: false
        default: "14"
      dry_run:
        description: "Dry run (no commit / skip writes where supported)"
        required: false
        default: "false"
      reason:
        description: "Why is this manual run?"
        required: false
        default: "manual"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: chica-feed
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Skip scheduled run if one just succeeded
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Looking for a successful Chica Daily run completed after ${cutoff} (excluding this run ${THIS_RUN})"
          if ! json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/chica-daily.yml/runs?status=success&per_page=20"); then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Could not list recent runs; continuing with populate."
            exit 0
          fi
          found=$(printf '%s' "$json" | jq --arg cutoff "$cutoff" --argjson this "$THIS_RUN" \
            '[.workflow_runs[] | select(.id != $this and .conclusion == "success" and .updated_at >= $cutoff)] | length')
          printf '%s' "$json" | jq --arg cutoff "$cutoff" --argjson this "$THIS_RUN" -r \
            '.workflow_runs[] | select(.id != $this and .conclusion == "success" and .updated_at >= $cutoff) | "recent success: id=\(.id) event=\(.event) updated_at=\(.updated_at) \(.html_url)"'
          if [ "$found" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A successful Chica Daily run completed within the last 90 minutes; skipping populate and commit."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No recent successful run found; continuing with populate."
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime deps
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f webapp/scripts/requirements.txt ]; then pip install -r webapp/scripts/requirements.txt; fi
          pip install "requests>=2.31" "beautifulsoup4>=4.12" "lxml>=5.0" || true

      - name: Ensure directories
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p scripts data/sales daily-packs social forecast reports webapp/data/cities

      - name: Sale policy regression tests
        if: steps.guard.outputs.skip != 'true'
        run: python3 -m unittest discover -s tests -v

      - name: Master populate (all source actions)
        id: run
        if: steps.guard.outputs.skip != 'true'
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
          PERMIT_DAYS: ${{ github.event.inputs.permit_days || '14' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="--date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/master_populate.py \
            --cities "$CITIES" \
            --permit-days "$PERMIT_DAYS" \
            $ARGS | tee daily-run.log

      - name: Validate canonical sale output
        if: steps.guard.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then ARGS="--today ${{ github.event.inputs.target_date }}"; fi
          python3 scripts/clean_sales.py webapp --check $ARGS

      - name: Guard against a sharp drop in upcoming sales
        if: steps.guard.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          python3 scripts/guard_populate_feed.py --git-ref origin/main

      - name: Upload run log
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chica-daily-log
          path: daily-run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Detect changes
        id: diff
        if: steps.guard.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet -- \
            data/sales daily-packs social forecast reports \
            webapp/data/cities webapp/data/community-events.json \
            webapp/data/scraper-health.json webapp/data/feed.json webapp/data/sales-clean.json webapp/data/sales-quality.json \
            2>/dev/null; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            git status --short -- \
              data/sales daily-packs social forecast reports \
              webapp/data/cities webapp/data/community-events.json \
              webapp/data/scraper-health.json webapp/data/feed.json webapp/data/sales-clean.json webapp/data/sales-quality.json || true
          fi

      - name: Commit daily populate
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.dirty == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "chicas-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/sales/ daily-packs/ social/ forecast/ reports/ \
            webapp/data/cities/ webapp/data/community-events.json \
            webapp/data/scraper-health.json webapp/data/feed.json webapp/data/sales-clean.json webapp/data/sales-quality.json \
            || true
          DATE=$(ls data/sales/*.json 2>/dev/null | xargs -n1 basename 2>/dev/null | sed 's/.json//' | sort | tail -1 || date -u +%Y-%m-%d)
          MSG="Chica master populate — ${DATE}"
          git commit -m "$MSG" || exit 0
          # Prefer generated data files on conflict (they are fully rewritten by populate)
          if ! git pull --rebase origin main; then
            echo "Rebase conflict detected — preferring generated data files"
            # During rebase: --theirs = the commit being applied (our generate)
            git checkout --theirs -- webapp/data/feed.json webapp/data/scraper-health.json webapp/data/community-events.json || true
            git add webapp/data/feed.json webapp/data/scraper-health.json webapp/data/community-events.json || true
            # Continue or abort if still conflicted
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain; aborting rebase and resetting to keep generated files"
              git rebase --abort
              git fetch origin
              git reset --hard origin/main
              # Re-add and recommit the generated state (working tree still has them if not reset, but reset clears; better re-run is heavy)
              # Since reset --hard loses the working tree changes, we rely on the checkout --theirs path succeeding for known files.
              # Fallback: force the known data files from the previous commit if needed.
              exit 1
            else
              GIT_EDITOR=true git rebase --continue
            fi
          fi
          git push origin HEAD:main

      - name: File ops issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[ops] Chica Daily failed";
            const body = [
              "Daily populate failed. Sentinel floor was not changed.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Read the log before re-dispatch. Do not add a second cron."
            ].join("\n");
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 30
            });
            const existing = issues.data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Summary
        if: always()
        run: |
          {
            echo "### Chica Daily Master Populate"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Guard skip: ${{ steps.guard.outputs.skip || 'false' }}"
            echo "- Cities: ${{ github.event.inputs.cities || 'san-antonio,austin' }}"
            echo "- Target input: ${{ github.event.inputs.target_date || 'auto (today CT)' }}"
            echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}"
            echo "- Changes: ${{ steps.diff.outputs.dirty || 'n/a' }}"
            echo "- Schedule: Mon–Thu 5:13 AM and 1:13 PM CT; Fri–Sun 5:13 AM, 7:13 AM, 10:13 AM, and 1:13 PM CT"
            echo "- Scheduled runs skip populate if a successful Chica Daily run (any event) finished in the last 90 minutes. Manual dispatches always run."
            echo ""
            echo "#### Run log"
            echo '```'
            cat daily-run.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
