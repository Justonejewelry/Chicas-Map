name: Chica Daily (Master Workflow)

# Unified populate: every map source + orchestrator + events + forecast.
# One cron. GitHub cron is UTC-only; dual 10/11 UTC was burning two runs/day.
# 11:00 UTC = 6 AM CDT / 5 AM CST. Close enough. Do not add a second cron.
# Do NOT put [skip ci] on the populate commit. That left GitHub Pages
# serving an empty public[] while main already had pins.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date YYYY-MM-DD (leave empty = today in America/Chicago)"
        required: false
        default: ""
      cities:
        description: "Cities to discover (comma-separated)"
        required: false
        default: "san-antonio,austin"
      permit_days:
        description: "SA permit lookback days"
        required: false
        default: "14"
      dry_run:
        description: "Dry run (no commit / skip writes where supported)"
        required: false
        default: "false"
      reason:
        description: "Why is this manual run?"
        required: false
        default: "manual"

permissions:
  contents: write
  issues: write

concurrency:
  group: chica-feed
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            webapp/scripts/requirements.txt

      - name: Install runtime deps
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f webapp/scripts/requirements.txt ]; then pip install -r webapp/scripts/requirements.txt; fi
          pip install "requests>=2.31" "beautifulsoup4>=4.12" "lxml>=5.0" || true

      - name: Ensure directories
        run: |
          mkdir -p scripts data/sales daily-packs social forecast reports webapp/data/cities

      - name: Master populate (all source actions)
        id: run
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
          PERMIT_DAYS: ${{ github.event.inputs.permit_days || '14' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="--date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/master_populate.py \
            --cities "$CITIES" \
            --permit-days "$PERMIT_DAYS" \
            $ARGS | tee daily-run.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chica-daily-log
          path: daily-run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Detect changes
        id: diff
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet -- \
            data/sales daily-packs social forecast reports \
            webapp/data/cities webapp/data/community-events.json \
            webapp/data/scraper-health.json webapp/data/feed.json \
            2>/dev/null; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            git status --short -- \
              data/sales daily-packs social forecast reports \
              webapp/data/cities webapp/data/community-events.json \
              webapp/data/scraper-health.json webapp/data/feed.json || true
          fi

      - name: Commit daily populate
        if: steps.diff.outputs.dirty == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "chicas-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/sales/ daily-packs/ social/ forecast/ reports/ \
            webapp/data/cities/ webapp/data/community-events.json \
            webapp/data/scraper-health.json webapp/data/feed.json \
            || true
          DATE=$(ls data/sales/*.json 2>/dev/null | xargs -n1 basename 2>/dev/null | sed 's/.json//' | sort | tail -1 || date -u +%Y-%m-%d)
          MSG="Chica master populate — ${DATE}"
          git commit -m "$MSG" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            echo "### Chica Daily Master Populate"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Cities: ${{ github.event.inputs.cities || 'san-antonio,austin' }}"
            echo "- Target input: ${{ github.event.inputs.target_date || 'auto (today CT)' }}"
            echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}"
            echo "- Changes: ${{ steps.diff.outputs.dirty || 'n/a' }}"
            echo "- Cron: 11:00 UTC (5 AM CST / 6 AM CDT) — single shot"
            echo ""
            echo "#### Run log"
            echo '```'
            cat daily-run.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
