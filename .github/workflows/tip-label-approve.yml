name: Approve tip by label

# Easiest owner path:
# 1) Open the tip issue (or create one with the JSON in the body)
# 2) Add label: tip-approved
# 3) This workflow publishes to permit-tips.json and closes the issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.label.name == 'tip-approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract tip JSON and publish
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';
            const title = context.payload.issue.title || '';

            // Prefer fenced ```json ... ``` block; else first { ... } object
            let raw = null;
            const fence = body.match(/```(?:json)?\s*([\s\S]*?)```/i);
            if (fence) raw = fence[1].trim();
            if (!raw) {
              const brace = body.match(/\{[\s\S]*\}/);
              if (brace) raw = brace[0];
            }
            if (!raw) {
              core.setFailed('No JSON tip found in issue body. Paste the tip JSON in a ```json block.');
              return;
            }

            let tip;
            try {
              tip = JSON.parse(raw);
            } catch (e) {
              core.setFailed('Invalid JSON in issue: ' + e.message);
              return;
            }
            if (!tip.address || !tip.schedule) {
              core.setFailed('Tip needs address and schedule');
              return;
            }

            tip.status = 'published';
            tip.published_at = new Date().toISOString();
            tip.published_via = 'label_tip_approved';
            tip.issue_number = context.payload.issue.number;

            const path = 'webapp/data/permit-tips.json';
            let data = {
              updated: '',
              disclaimer:
                'Tips are submitted by users who attest they are the permit holder or agent. YardBird and the City of San Antonio do not verify identity or accuracy. Tips are not official city records.',
              tips: [],
            };
            if (fs.existsSync(path)) data = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(data.tips)) data.tips = [];

            const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            const addr = norm(tip.address);
            const pmt = norm(tip.permit_number);
            data.tips = data.tips.filter((t) => {
              const sameAddr = addr && norm(t.address) === addr;
              const samePmt = pmt && norm(t.permit_number) === pmt;
              return !(sameAddr || samePmt);
            });
            data.tips.push(tip);
            data.updated = new Date().toISOString().slice(0, 10);
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');

            // Trim pending file if present
            const pendingPath = 'webapp/data/permit-tips-pending.json';
            if (fs.existsSync(pendingPath)) {
              const pending = JSON.parse(fs.readFileSync(pendingPath, 'utf8'));
              pending.tips = (pending.tips || []).filter(
                (t) => norm(t.address) !== addr && (!pmt || norm(t.permit_number) !== pmt)
              );
              pending.updated = data.updated;
              fs.writeFileSync(pendingPath, JSON.stringify(pending, null, 2) + '\n');
            }

            core.info('Published tip from issue #' + context.payload.issue.number + ': ' + tip.address);

      - name: Commit
        run: |
          git config user.name "YardBird Tip Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/data/permit-tips.json webapp/data/permit-tips-pending.json || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish tip from issue #${{ github.event.issue.number }} (label tip-approved)"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: 'Published to the map (label `tip-approved`). Hard-refresh: https://justonejewelry.github.io/Project-YardBird/map.html',
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              labels: ['tip-approved', 'tip-published'],
            });
