name: PR preview on GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "webapp/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/preview.yml"

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Stage preview
        run: |
          set -euo pipefail
          N="${{ github.event.number }}"
          rm -rf preview-out
          mkdir -p preview-out
          cp -R webapp/. preview-out/
          find preview-out -type f \( -name '*.html' -o -name '*.js' -o -name '*.xml' -o -name '*.webmanifest' -o -name '*.json' -o -name '*.txt' -o -name '*.css' \) \
            -print0 | xargs -0 sed -i "s#/Chicas-Map/#/Chicas-Map/preview/${N}/#g"

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: preview-out
          branch: previews
          target-folder: pr/${{ github.event.number }}
          commit-message: "preview pr ${{ github.event.number }}"
          force: false

      - name: Redeploy Pages
        run: gh workflow run pages.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment preview link
        run: |
          URL="https://justonejewelry.github.io/Chicas-Map/preview/${{ github.event.number }}/"
          gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          Preview for this PR (live after the Pages workflow finishes, ~1 min):

          ${URL}

          Spanish shell: ${URL}es/
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: previews

      - name: Remove preview folder
        if: hashFiles('pr/${{ github.event.number }}') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "pr/${{ github.event.number }}"
          git add -A
          git commit -m "remove preview pr ${{ github.event.number }}" || true
          git push origin HEAD:previews || true

      - name: Redeploy Pages
        run: gh workflow run pages.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
