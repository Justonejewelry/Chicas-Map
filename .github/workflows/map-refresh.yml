name: Map feed refresh

on:
  schedule:
    # Every 2 hours (UTC)
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      cities:
        description: "Cities to discover (comma-separated)"
        required: false
        default: "san-antonio,austin"
      permit_days:
        description: "SA permit lookback days"
        required: false
        default: "14"
      reason:
        description: "Why is this manual run?"
        required: false
        default: "manual"

permissions:
  contents: write
  issues: write

concurrency:
  group: map-refresh
  cancel-in-progress: true

jobs:
  discover-purge-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: HTTP discover + parse (GarageSaleFinder)
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
        run: |
          set -e
          python3 webapp/scripts/discover_sales.py --cities "$CITIES" | tee discover.log

      - name: Fetch SA garage/estate permits (Open Data SA)
        env:
          DAYS: ${{ github.event.inputs.permit_days || '14' }}
        run: |
          set -e
          python3 webapp/scripts/fetch_permits.py --days "$DAYS" | tee permits.log

      - name: EstateSales.org free discovery
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
        run: |
          set -e
          # Free HTML + embedded JSON — no API key, no paid service
          python3 webapp/scripts/fetch_estatesales_org.py --cities "$CITIES" | tee estatesales-org.log || true

      - name: YardSaleSearch free discovery
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
        run: |
          set -e
          # schema.org Place/PostalAddress + lat/lon — free, no key
          python3 webapp/scripts/fetch_yardsalesearch.py --cities "$CITIES" | tee yardsalesearch.log || true

      - name: Craigslist free discovery
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
        run: |
          set -e
          # static search results + bounded detail enrichment — free, no key
          python3 webapp/scripts/fetch_craigslist.py --cities "$CITIES" | tee craigslist.log || true

      - name: EstateSales.net lightweight discovery
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
        run: |
          set -e
          # Free HTTP path — often thin because site is SPA; still useful when SSR leaks data
          python3 webapp/scripts/fetch_estatesales.py --cities "$CITIES" | tee estatesales.log || true

      - name: EstateSales.net via Apify (optional — skipped without token)
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set -e
          # Not required. Exits cleanly when APIFY_TOKEN is absent.
          python3 webapp/scripts/fetch_estatesales_apify.py --cities "$CITIES" | tee estatesales-apify.log || true

      - name: Purge expired listings
        run: |
          python3 webapp/scripts/purge_expired.py | tee purge.log

      - name: Scraper health check
        id: health
        run: |
          set +e
          python3 webapp/scripts/check_scraper_health.py | tee health.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          # Always continue — soft-fail policy; alerts are via issues + summary
          exit 0

      - name: Detect git changes
        id: diff
        run: |
          if git diff --quiet -- webapp/data/cities webapp/data/scraper-health.json; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- webapp/data/cities webapp/data/scraper-health.json || true
          fi

      - name: Commit and push
        if: steps.diff.outputs.dirty == 'true'
        run: |
          set -e
          git config user.name "chicas-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/data/cities/*.json webapp/data/scraper-health.json || true
          MSG="Map refresh $(date -u +%Y-%m-%dT%H:%MZ) — GSF + permits + ESO + YSS + CL free + purge + health [skip ci]"
          git commit -m "$MSG" || exit 0
          # Rebase onto any concurrent commits (docs, manual fixes) then push
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Open or update scraper-failure issue
        if: steps.health.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TITLE="Scraper failure alert — primary free source(s) unhealthy"
          HEALTH_SNIPPET=$(cat health.log 2>/dev/null || echo "(no health.log)")
          BODY=$(cat <<EOF
          ## Scraper health alert

          One or more **primary free sources** (EstateSales.org, YardSaleSearch, Craigslist) reported failure or zero listings on the latest map-refresh run.

          - Workflow: [Map feed refresh](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - Run: #${{ github.run_number }}
          - Trigger: ${{ github.event_name }}

          ### Health log
          \`\`\`
          ${HEALTH_SNIPPET}
          \`\`\`

          Soft-fail policy keeps the map pipeline running. Investigate the failing source(s) and re-run after a fix.

          Label: \`scraper-failure\`
          EOF
          )
          # Avoid duplicate open issues
          EXISTING=$(gh issue list --label scraper-failure --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "scraper-failure" || \
              gh issue create --title "$TITLE" --body "$BODY"
            echo "Created new scraper-failure issue"
          fi

      - name: Summary
        run: |
          {
            echo "### Map refresh (all free sources + optional Apify)"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Cities: ${{ github.event.inputs.cities || 'san-antonio,austin' }}"
            echo "- Permit lookback: ${{ github.event.inputs.permit_days || '14' }} days"
            echo "- Changes committed: ${{ steps.diff.outputs.dirty }}"
            echo "- Health exit: ${{ steps.health.outputs.exit_code }}"
            echo ""
            echo "#### Scraper health"
            echo '```'
            cat health.log 2>/dev/null || echo "(no health.log)"
            echo '```'
            echo ""
            echo "#### Discover (GSF)"
            echo '```'
            cat discover.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "#### Permits (estate-tagged)"
            echo '```'
            cat permits.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "#### EstateSales.org (free)"
            echo '```'
            cat estatesales-org.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "#### YardSaleSearch (free)"
            echo '```'
            cat yardsalesearch.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "#### Craigslist (free)"
            echo '```'
            cat craigslist.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "#### EstateSales.net (lightweight free)"
            echo '```'
            cat estatesales.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "#### EstateSales.net (Apify optional)"
            echo '```'
            cat estatesales-apify.log 2>/dev/null || echo "(no log / no token)"
            echo '```'
            echo "#### Purge"
            echo '```'
            cat purge.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
