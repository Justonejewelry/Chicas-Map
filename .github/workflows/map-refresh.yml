name: Map feed refresh

# Manual twin of Chica Daily. Do not grow a second scraper chain here.
# Discovery, permits, purge, health, and the orchestrator live in
# scripts/master_populate.py. This workflow only dispatches that path.
on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Cities to discover (comma-separated)"
        required: false
        default: "san-antonio,austin"
      permit_days:
        description: "SA permit lookback days"
        required: false
        default: "14"
      target_date:
        description: "Target date YYYY-MM-DD (leave empty = today in America/Chicago)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no commit / skip writes where supported)"
        required: false
        default: "false"
      reason:
        description: "Why is this manual run?"
        required: false
        default: "manual"

permissions:
  contents: write
  issues: write

concurrency:
  group: chica-feed
  cancel-in-progress: false

jobs:
  discover-purge-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime deps
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f webapp/scripts/requirements.txt ]; then pip install -r webapp/scripts/requirements.txt; fi
          pip install "requests>=2.31" "beautifulsoup4>=4.12" "lxml>=5.0" || true

      - name: Master populate
        env:
          CITIES: ${{ github.event.inputs.cities || 'san-antonio,austin' }}
          PERMIT_DAYS: ${{ github.event.inputs.permit_days || '14' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="--date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/master_populate.py \
            --cities "$CITIES" \
            --permit-days "$PERMIT_DAYS" \
            $ARGS | tee daily-run.log

      - name: Detect changes
        id: diff
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet -- \
            data/sales daily-packs social forecast reports \
            webapp/data/cities webapp/data/community-events.json \
            webapp/data/scraper-health.json webapp/data/feed.json \
            2>/dev/null; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refresh
        if: steps.diff.outputs.dirty == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "chicas-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/sales/ daily-packs/ social/ forecast/ reports/ \
            webapp/data/cities/ webapp/data/community-events.json \
            webapp/data/scraper-health.json webapp/data/feed.json \
            || true
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Map refresh ${DATE} — ${{ github.event.inputs.reason || 'manual' }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            echo "### Map refresh"
            echo ""
            echo "- Path: scripts/master_populate.py (same as Chica Daily)"
            echo "- Lock: chica-feed"
            echo "- Reason: ${{ github.event.inputs.reason || 'manual' }}"
            echo "- Changes: ${{ steps.diff.outputs.dirty || 'n/a' }}"
            echo ""
            echo '```'
            cat daily-run.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
