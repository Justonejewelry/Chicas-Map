name: Decode reel thumbnails (one-shot)

on:
  push:
    branches: [main]
    paths:
      - "webapp/media/reels-bundle.b64"

permissions:
  contents: write
  actions: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack reel JPEGs, remove bundle, redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base64 -d webapp/media/reels-bundle.b64 > /tmp/reels.tgz
          tar -C webapp/media -xzf /tmp/reels.tgz
          git rm -q webapp/media/reels-bundle.b64
          n=0; for f in webapp/media/reels/*.jpg; do head -c3 "$f" | od -An -tx1 | grep -q 'ff d8 ff'; n=$((n+1)); done; echo "jpegs $n"; test "$n" -eq 26
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A webapp/media/reels
          git commit -m "Add Chica reel thumbnails (binary JPEG)"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
