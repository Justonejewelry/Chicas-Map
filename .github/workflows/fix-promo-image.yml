name: Fix promo image binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64-as-text into real JPEG
        run: |
          set -euo pipefail
          f=assets/promo/find-my-sale-chicas-map.jpg
          python3 -c '
          from pathlib import Path
          import base64, re, sys
          p = Path("assets/promo/find-my-sale-chicas-map.jpg")
          raw = p.read_bytes()
          if raw[:3] == b"\xff\xd8\xff":
              print("already jpeg", len(raw))
              sys.exit(0)
          text = re.sub(r"\s+", "", raw.decode("ascii"))
          data = base64.b64decode(text)
          assert data[:3] == b"\xff\xd8\xff", data[:20]
          p.write_bytes(data)
          print("decoded", len(data))
          '
          if git diff --quiet -- "$f"; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Fix Chica promo image (binary JPEG)"
          git push origin HEAD:main
