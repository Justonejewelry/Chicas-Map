name: Tip webhooks

# Automation entry points (no public write without a secret held by the caller):
#   tip_submit  — store pending tip, open tracking issue
#   tip_approve — publish tip to permit-tips.json (map)
#
# Call with:
#   POST /repos/{owner}/{repo}/dispatches
#   { "event_type": "tip_approve", "client_payload": { ...tip } }

on:
  repository_dispatch:
    types: [tip_submit, tip_approve]
  workflow_dispatch:
    inputs:
      action:
        description: "submit or approve"
        required: true
        type: choice
        options: [approve, submit]
      tip_json:
        description: "Tip JSON object"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            let tip;
            let action = 'approve';
            if (context.eventName === 'repository_dispatch') {
              action = context.payload.action; // tip_submit | tip_approve
              tip = context.payload.client_payload || {};
              // allow nested { tip: {...} }
              if (tip.tip && typeof tip.tip === 'object') tip = tip.tip;
            } else {
              action = process.env.WF_ACTION === 'submit' ? 'tip_submit' : 'tip_approve';
              try {
                tip = JSON.parse(process.env.TIP_JSON || '{}');
              } catch (e) {
                core.setFailed('Invalid tip_json: ' + e.message);
                return;
              }
            }
            if (!tip.address || !tip.schedule) {
              core.setFailed('Tip requires address and schedule');
              return;
            }
            core.setOutput('action', action);
            core.setOutput('tip', JSON.stringify(tip));
            core.info('action=' + action + ' address=' + tip.address);
        env:
          WF_ACTION: ${{ inputs.action }}
          TIP_JSON: ${{ inputs.tip_json }}

      - name: Pending queue (tip_submit)
        if: steps.payload.outputs.action == 'tip_submit'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tip = JSON.parse(process.env.TIP);
            tip.status = 'pending_review';
            tip.received_at = new Date().toISOString();
            tip.id = tip.id || ('tip_' + Date.now().toString(36));

            const path = 'webapp/data/permit-tips-pending.json';
            let data = { updated: '', tips: [] };
            if (fs.existsSync(path)) data = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(data.tips)) data.tips = [];
            data.tips = data.tips.filter(t => t.id !== tip.id);
            data.tips.unshift(tip);
            data.tips = data.tips.slice(0, 100);
            data.updated = new Date().toISOString().slice(0, 10);
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');

            const body = [
              '## Pending permit tip',
              '',
              '**Address:** ' + tip.address,
              '**Schedule:** ' + tip.schedule,
              '**Summary:** ' + (tip.summary || '—'),
              '**Permit:** ' + (tip.permit_number || '—'),
              '**id:** `' + tip.id + '`',
              '',
              '### Approve',
              '1. Actions → **Tip webhooks** → Run workflow → action=`approve` → paste JSON below, or',
              '2. `repository_dispatch` event_type `tip_approve` with this payload, or',
              '3. Admin page: https://justonejewelry.github.io/Chicas-Map/admin/approve.html',
              '',
              '```json',
              JSON.stringify(tip, null, 2),
              '```',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[tip pending] ' + String(tip.address).slice(0, 80),
              body,
              labels: ['tip-pending'],
            });
            core.setOutput('tip_id', tip.id);
        env:
          TIP: ${{ steps.payload.outputs.tip }}

      - name: Publish (tip_approve)
        if: steps.payload.outputs.action == 'tip_approve'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tip = JSON.parse(process.env.TIP);
            tip.status = 'published';
            tip.published_at = new Date().toISOString();
            tip.published_via = 'webhook_tip_approve';

            const path = 'webapp/data/permit-tips.json';
            let data = {
              updated: '',
              disclaimer:
                'Tips are submitted by users who attest they are the permit holder or agent. Chicas-Map and the City of San Antonio do not verify identity or accuracy. Tips are not official city records.',
              tips: [],
            };
            if (fs.existsSync(path)) data = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(data.tips)) data.tips = [];

            const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            const addr = norm(tip.address);
            const pmt = norm(tip.permit_number);
            data.tips = data.tips.filter((t) => {
              const sameAddr = addr && norm(t.address) === addr;
              const samePmt = pmt && norm(t.permit_number) === pmt;
              return !(sameAddr || samePmt);
            });
            data.tips.push(tip);
            data.updated = new Date().toISOString().slice(0, 10);
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');

            // Drop from pending if present
            const pendingPath = 'webapp/data/permit-tips-pending.json';
            if (fs.existsSync(pendingPath)) {
              const pending = JSON.parse(fs.readFileSync(pendingPath, 'utf8'));
              pending.tips = (pending.tips || []).filter(
                (t) => t.id !== tip.id && norm(t.address) !== addr
              );
              pending.updated = data.updated;
              fs.writeFileSync(pendingPath, JSON.stringify(pending, null, 2) + '\n');
            }
            core.info('Published: ' + tip.address);
        env:
          TIP: ${{ steps.payload.outputs.tip }}

      - name: Commit
        run: |
          git config user.name "Chicas-Map Tip Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/data/permit-tips.json webapp/data/permit-tips-pending.json || true
          if git diff --staged --quiet; then
            echo "No file changes"
            exit 0
          fi
          git commit -m "tip webhook: ${{ steps.payload.outputs.action }}"
          git push
