name: Chica's Map — Community Events Swarm v2

# Daily structured discovery for the "What's Happening" layer.
# Sources: config/community-event-sources.json (city-config ready).
# Script: scripts/community_events_swarm.py
# Gate: scripts/events_sentinel.py (date, location, URL, confidence).
# Store: webapp/data/community-events.json (no Google Calendar).
# HOA / OCR / headless remain deferred. Frontend layer is unchanged.

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  event-scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run community-events swarm v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/community_events_swarm.py

      - name: Commit feed and daily report
        run: |
          git config user.name "Chica's Map Events Swarm"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/data/community-events.json reports/community-events-latest.md
          git diff --cached --quiet || git commit -m "chore: refresh community events swarm v2"
          git push
