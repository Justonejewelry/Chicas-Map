name: Chica's Map — Community Events Swarm

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  event-scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run community-events swarm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/community_events_swarm.py

      - name: Commit approved feed and daily report
        run: |
          git config user.name "Chica's Map Events Swarm"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/data/community-events.json reports/community-events-latest.md
          git diff --cached --quiet || git commit -m "chore: refresh community events swarm"
          git push
