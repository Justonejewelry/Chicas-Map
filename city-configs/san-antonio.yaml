# San Antonio — Reference City Config (YAML)
# Project YardBird / GSIN
# Machine-readable. Prefer this over the .md version for scripts and agents.
# Updated 2026-11-11: full public source inventory included.

slug: san-antonio
name: San Antonio
state: TX
timezone: America/Chicago
typical_sale_window: "Fri-Sun, peak Sat 07:00-11:00"
synonyms:
  - garage sale
  - yard sale
  - estate sale
  - moving sale
  - community sale
  - rummage sale

bounds:
  center: [29.4241, -98.4936]
  north: 29.65
  south: 29.20
  east: -98.20
  west: -98.80
  notes: "Includes Helotes, Boerne, Schertz/Cibolo, Alamo Ranch, Stone Oak"

hot_zones:
  - Alamo Ranch
  - Stone Oak
  - Helotes
  - Boerne
  - Schertz
  - The Dominion
  - Fair Oaks Ranch
  - Leon Springs
  - Shavano Park
  - Hollywood Park
  - Terrell Hills
  - Alamo Heights
  - Northwest Side
  - Northeast Side

sources:
  # --- Tier 1: Highest trust / structured ---
  estatesales:
    urls:
      - https://www.estatesales.net/TX/San-Antonio
      - https://www.estatesales.org
    notes: "Professional estate sales. Current strongest automated backbone."
    agents: [Heritage]
    priority: high

  municipal_permits:
    open_data: https://data.sanantonio.gov/dataset/building-permits
    notes: >
      City of San Antonio garage/yard/estate sale permits are public records.
      Open Data SA publishes bulk CSVs that include garage sale permits issued
      (2020–2024 historical + ongoing yearly extracts). Accela Citizen Access
      allows public record search. Texas Public Information Act applies.
      Highest trust when a matching permit exists.
    agents: [Permit]
    priority: high

  # --- Tier 1.5: Public aggregators ---
  yardsalesearch:
    url: https://www.yardsalesearch.com/garage-sales-san-antonio-tx.html
    notes: "Large national user-posted garage/yard sale network. Public HTML."
    agents: [Press]
    priority: medium-high

  garagesalefinder:
    url: https://garagesalefinder.com/yard-sales/san-antonio-tx/
    notes: "Aggregator network with live SA listings (addresses, dates, descriptions)."
    agents: [Press]
    priority: medium-high

  # --- Tier 2: Local classifieds & constrained platforms ---
  craigslist:
    domain: sanantonio.craigslist.org
    gms_path: /search/gms
    rss: https://sanantonio.craigslist.org/search/gms?format=rss
    notes: "Classic classifieds. Currently rate-limited/blocked for heavy automation. Mercury Swarm handles multi-path resilience."
    agents: [Mercury-RSS, Mercury-Browser, Mercury-Cache, Mercury-Aggregator, Mercury-Dedupe]
    priority: medium

  express_news:
    url: https://hearst-mp.ipublishmarketplace.com/marketplace/sanantonio/category/estate-garage-sales
    notes: "San Antonio Express-News / Hearst Marketplace. Estate & Garage Sales classifieds. Public HTML; fetch_express_news.py."
    agents: [Press]
    priority: medium

  wilson_county_news:
    url: https://www.wilsoncountynews.com/classifieds/category/garage-sale/
    notes: "Wilson County News GeoDirectory garage classifieds. Public HTML; fetch_wilson_county.py. Robots allow /classifieds/."
    agents: [Press]
    priority: medium

  yardsales_net:
    url: https://yardsales.net/san-antonio-tx/
    notes: "Treasure Listings family (with YSS/GSF/gsalr). Hard-deduped at ingest. 403 from Actions runners fails soft. fetch_yardsales_net.py."
    agents: [Press]
    priority: medium-low

  abetterestatesale:
    url: https://www.abetterestatesale.com/upcoming-sales/
    notes: "A Better Estate Sale calendar. Street address posts 9 a.m. CT the day before; area pins until then. fetch_abetterestatesale.py."
    agents: [Press]
    priority: medium

  herald_zeitung:
    url: https://herald-zeitung.com/classifieds/garage_sales/garage_sales/
    notes: "BLOX garage classifieds (Herald-Zeitung). No query strings (robots Disallow /classifieds/*?). 429 backoff. fetch_blox_classifieds.py."
    agents: [Press]
    priority: low

  seguin_gazette:
    url: https://seguingazette.com/classifieds/garage_sales/garage_sales/
    notes: "BLOX garage classifieds (Seguin Gazette). No query strings. 429 backoff. fetch_blox_classifieds.py."
    agents: [Press]
    priority: low

  allevents:
    url: https://allevents.in/san-antonio/garage-sale
    notes: "AllEvents SA listings with a strict garage/yard/estate/rummage/moving-sale title filter. fetch_event_listings.py."
    agents: [Press]
    priority: low

  eventbrite_sales:
    url: https://www.eventbrite.com/d/tx--san-antonio/rummage-sale/
    notes: "Eventbrite SA search pages with the same strict sale-title filter. fetch_event_listings.py. Distinct from the disabled community-events Eventbrite entry."
    agents: [Press]
    priority: low

  facebook_public:
    notes: >
      Public content only (public pages, public events, hashtags, user tips).
      No Graph API for Marketplace or Groups (deprecated / non-existent).
      Echo Swarm remains non-API for primary targets.
    agents: [Echo-Marketplace, Echo-Groups, Echo-Public, Echo-Hashtag, Echo-Lens]
    priority: medium-low

  # --- Tier 3: Community & supporting ---
  reddit:
    subreddits: ["r/sanantonio", "r/SanAntonio"]
    notes: "Local community posts."
    agents: [Crow]
    priority: low-medium

  nextdoor:
    notes: "HOA and neighborhood pages in hot zones. Mostly account-walled; limited public view."
    agents: [Neighbor]
    priority: low

  yard_sale_treasure_map:
    notes: "User-submitted map/app listings. Craigslist feed license ended; now mostly voluntary posts."
    agents: [Press]
    priority: low

  church_school_nonprofit:
    notes: "Church bulletins, school newsletters, non-profit rummage/bazaar announcements."
    agents: [Parish]
    priority: low

  offerup_similar:
    notes: "Item marketplaces. Occasional multi-item 'yard sale' style posts. Noisy, low priority."
    agents: [Signal]
    priority: low

  search_engine_indexes:
    notes: "Google/Bing indexed public posts (including some public Facebook pages). Secondary signal only."
    agents: [Mercury-Cache, Signal]
    priority: low

  hashtags_social:
    hashtags: ["#SAGarageSale", "#SanAntonioYardSale", "#AlamoRanchSale", "#HelotesSale"]
    notes: "Cross-platform hashtag monitoring."
    agents: [Signal, Echo-Hashtag]
    priority: low

value_notes:
  high_demand: [tools, mid-century furniture, vintage toys, electronics, antiques, records, cameras]
  weather_sensitivity: high
  peak_advice: "Get there before 9 AM for best selection"

map_defaults:
  default_zoom: "metro Alamo Ranch to Schertz corridor"
  clustering: true
  priority_badges: ["early-start", "high-value", "estate"]

status: reference
last_updated: "2026-11-11"
